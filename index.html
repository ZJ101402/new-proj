<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清补凉网页作品集</title>
  <style>
    :root {
      color-scheme: light;
      --green: #0f8f71;
      --green-dark: #06624e;
      --mint: #d9fff3;
      --cream: #fff8e7;
      --orange: #ff9d42;
      --ink: #14332c;
      --muted: #58766d;
      --card: rgba(255, 255, 255, 0.82);
      --shadow: 0 24px 70px rgba(15, 143, 113, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(255, 211, 120, 0.35), transparent 28rem),
        radial-gradient(circle at 88% 8%, rgba(80, 215, 187, 0.35), transparent 26rem),
        linear-gradient(135deg, #f4fff8 0%, #fff7df 48%, #e7fff7 100%);
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 42px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(15, 143, 113, 0.14);
      border-radius: 34px;
      padding: clamp(32px, 6vw, 68px);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(236, 255, 248, 0.86));
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "🥥";
      position: absolute;
      right: clamp(18px, 6vw, 76px);
      top: 20px;
      font-size: clamp(72px, 13vw, 150px);
      opacity: 0.13;
      transform: rotate(-12deg);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--mint);
      color: var(--green-dark);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 13px;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(40px, 7vw, 82px);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    .hero p {
      max-width: 680px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 21px);
      line-height: 1.8;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 999px;
      color: #fff;
      background: var(--green);
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 12px 26px rgba(15, 143, 113, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button.secondary {
      color: var(--green-dark);
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(15, 143, 113, 0.22);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(15, 143, 113, 0.26);
    }

    .section-title {
      margin: 46px 0 18px;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: -0.03em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(15, 143, 113, 0.14);
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 18px 48px rgba(20, 51, 44, 0.1);
      backdrop-filter: blur(18px);
    }

    .preview {
      width: 100%;
      height: 300px;
      border: 0;
      background: #fff;
      transform-origin: top left;
    }

    .card-body {
      padding: 22px;
    }

    .tag {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--green-dark);
      background: rgba(15, 143, 113, 0.1);
      font-size: 12px;
      font-weight: 800;
    }

    .card h2 {
      margin: 0;
      font-size: 22px;
    }

    .card p {
      margin: 10px 0 18px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .card a {
      color: var(--green-dark);
      font-weight: 800;
      text-decoration: none;
    }

    .card a:hover {
      color: var(--orange);
    }

    footer {
      margin-top: 42px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .preview {
        height: 420px;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 20px, 1120px);
        padding-top: 24px;
      }

      .hero,
      .card {
        border-radius: 22px;
      }

      .preview {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="main-title">
      <p class="eyebrow">海南风味 · 清补凉网页合集</p>
      <h1 id="main-title">椰风一吹，清凉上线。</h1>
      <p>
        这里整理了当前项目里的所有小网页：品牌卡片、促销展示和在线点餐。
        点击任意卡片即可进入对应页面，也可以直接在下方预览它们的样子。
      </p>
      <div class="actions" aria-label="快捷入口">
        <a class="button" href="coconut-breeze-qingbuliang-promo.html">查看促销页</a>
        <a class="button secondary" href="coconut-breeze-qingbuliang-order.html">开始点餐</a>
      </div>
    </section>

    <h2 class="section-title">全部网页</h2>

    <section class="grid" aria-label="网页列表">
      <article class="card">
        <iframe class="preview" src="ada-qingbuliang-card.html" title="阿达清补凉卡片页面预览"></iframe>
        <div class="card-body">
          <span class="tag">品牌卡片</span>
          <h2>阿达清补凉</h2>
          <p>适合用作店铺名片、宣传入口或品牌视觉展示。</p>
          <a href="ada-qingbuliang-card.html">打开页面 →</a>
        </div>
      </article>

      <article class="card">
        <iframe class="preview" src="coconut-breeze-qingbuliang-promo.html" title="椰风清补凉促销页面预览"></iframe>
        <div class="card-body">
          <span class="tag">宣传展示</span>
          <h2>椰风清补凉</h2>
          <p>夏日清凉主题的促销落地页，适合展示产品与门店信息。</p>
          <a href="coconut-breeze-qingbuliang-promo.html">打开页面 →</a>
        </div>
      </article>

      <article class="card">
        <iframe class="preview" src="coconut-breeze-qingbuliang-order.html" title="椰风清补凉在线点餐页面预览"></iframe>
        <div class="card-body">
          <span class="tag">在线点餐</span>
          <h2>椰风清补凉点餐</h2>
          <p>包含规格、加料、甜度选择和订单汇总的互动点餐页面。</p>
          <a href="coconut-breeze-qingbuliang-order.html">打开页面 →</a>
        </div>
      </article>
    </section>

    <footer>
      <p>© 清补凉网页作品集 · GitHub Pages</p>
    </footer>
  </main>
</body>
</html>
