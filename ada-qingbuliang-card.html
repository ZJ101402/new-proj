<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d9eb2">
  <title>阿达清补凉 | 海南清补凉店老板</title>
  <style>
    :root {
      --ocean: #0c9ab0;
      --deep-ocean: #08728b;
      --lagoon: #b9f0e5;
      --palm: #14755f;
      --sun: #ffd552;
      --coral: #ff855d;
      --ink: #073d4d;
      --cream: #fffdf3;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 28px 18px;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 16%, rgba(255, 255, 255, .35) 0 4px, transparent 5px),
        radial-gradient(circle at 93% 78%, rgba(255, 255, 255, .25) 0 3px, transparent 4px),
        linear-gradient(145deg, #087c9d 0%, #13afbd 50%, #9fe5cf 100%);
    }

    .card {
      position: relative;
      width: min(100%, 440px);
      min-height: 690px;
      isolation: isolate;
      overflow: hidden;
      border: 5px solid rgba(255, 255, 255, .5);
      border-radius: 28px;
      padding: 42px 28px 34px;
      background: linear-gradient(165deg, #ddfff1 0%, #bdeee1 50%, #89d9d2 100%);
      box-shadow: 0 24px 54px rgba(0, 57, 74, .35);
    }

    .sun {
      position: absolute;
      z-index: -2;
      top: -78px;
      right: -57px;
      width: 222px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 0 18px rgba(255, 213, 82, .18);
    }

    .palm-leaves {
      position: absolute;
      z-index: -1;
      top: -37px;
      left: -46px;
      width: 234px;
      height: 234px;
      opacity: .93;
      transform: rotate(-18deg);
      background: repeating-conic-gradient(from 14deg, var(--palm) 0 13deg, transparent 13deg 25deg);
      clip-path: polygon(45% 45%, 0 0, 24% 15%, 6% 36%, 37% 35%, 24% 62%, 51% 50%, 55% 88%, 65% 53%, 95% 66%, 68% 44%, 100% 25%, 63% 36%, 75% 0, 52% 30%);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      color: #076d76;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .eyebrow::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--coral);
      content: "";
    }

    h1 {
      max-width: 270px;
      margin: 0;
      color: #07576a;
      font-size: clamp(39px, 10vw, 52px);
      line-height: 1.08;
      letter-spacing: .04em;
    }

    .role {
      margin: 13px 0 0;
      color: #0b6570;
      font-size: 17px;
      font-weight: 700;
    }

    .intro {
      max-width: 300px;
      margin: 26px 0 0;
      padding: 15px 17px;
      border-left: 4px solid var(--coral);
      background: rgba(255, 253, 243, .77);
      color: #12606b;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.7;
    }

    .product-photo {
      position: relative;
      width: 100%;
      height: 210px;
      margin: 24px 0 22px;
      overflow: hidden;
      border: 5px solid rgba(255, 253, 243, .88);
      border-radius: 17px;
      background: #087f92;
      box-shadow: 0 12px 18px rgba(2, 87, 96, .18);
    }

    .product-photo::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 48%, rgba(2, 63, 77, .46));
      pointer-events: none;
      content: "";
    }

    .product-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 54%;
    }

    .photo-credit {
      position: absolute;
      z-index: 1;
      right: 9px;
      bottom: 7px;
      margin: 0;
      color: rgba(255, 255, 255, .9);
      font-size: 10px;
      font-weight: 600;
    }

    .photo-credit a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .tags {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .tag {
      min-height: 74px;
      display: grid;
      place-items: center;
      padding: 9px 7px;
      border: 2px solid rgba(9, 109, 112, .16);
      border-radius: 14px;
      background: rgba(255, 253, 243, .82);
      color: #09676c;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;
    }

    .tag:nth-child(2) { background: rgba(255, 232, 126, .9); color: #825d13; }
    .tag:nth-child(3) { background: rgba(255, 184, 129, .86); color: #88472e; }

    .footnote {
      margin: 20px 0 0;
      color: rgba(5, 87, 103, .78);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      letter-spacing: .08em;
    }

    @media (max-width: 380px) {
      body { padding: 14px 10px; }
      .card { min-height: 640px; padding: 34px 21px 27px; border-radius: 23px; }
      .product-photo { height: 185px; margin-top: 19px; }
      .tag { font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="阿达清补凉个人名片">
    <div class="sun" aria-hidden="true"></div>
    <div class="palm-leaves" aria-hidden="true"></div>

    <p class="eyebrow">HAIKOU, HAINAN</p>
    <h1>阿达<br>清补凉</h1>
    <p class="role">海南清补凉店老板</p>
    <p class="intro">做了多年清补凉，海口老品牌</p>

    <figure class="product-photo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Qingbuliang_at_a_restaurant_in_Sanya_%2820230324201224%29.jpg/960px-Qingbuliang_at_a_restaurant_in_Sanya_%2820230324201224%29.jpg" alt="一碗配料丰富的海南清补凉">
      <figcaption class="photo-credit"><a href="https://commons.wikimedia.org/wiki/File:Qingbuliang_at_a_restaurant_in_Sanya_(20230324201224).jpg">Photo: N509FZ / CC BY-SA 4.0</a></figcaption>
    </figure>

    <section class="tags" aria-label="服务特色">
      <div class="tag">正宗<br>海南味</div>
      <div class="tag">料超足</div>
      <div class="tag">送货<br>上门</div>
    </section>
    <p class="footnote">一碗清凉，满口海南</p>
  </main>
</body>
</html>
